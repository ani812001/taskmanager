<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Task</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#f2f2f2;">

<div class="container mt-5">

    <div class="card shadow p-5 mx-auto" style="max-width: 900px;">

        <h1 class="text-center mb-5">
            Add New Task
        </h1>

        <form th:action="@{/save}" th:object="${task}" method="post">


            <div class="mb-3">
                <label class="form-label">
                    Task Title:
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{title}">
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Description:
                </label>

                <textarea class="form-control"
                          rows="3"
                          th:field="*{description}">
                </textarea>
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Assignee:
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{assignee}">
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Due Date:
                </label>

                <input type="date"
                       class="form-control"
                       th:field="*{dueDate}">
            </div>


            <div class="mb-4">
                <label class="form-label">
                    Priority:
                </label>

                <select class="form-select"
                        th:field="*{priority}">

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>
            </div>


            <button type="submit"
                    class="btn btn-success w-100">

                Add Task

            </button>

        </form>

    </div>

</div>

</body>
</html>
