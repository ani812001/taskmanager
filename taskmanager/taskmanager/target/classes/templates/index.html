<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Assignment System</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#f2f2f2;">

<div class="container mt-5">

    <h1 class="text-center mb-5">
        Assignment System
    </h1>

    <div class="card shadow p-5">

        <h2 class="text-center mb-4">
            Welcome to the Task Assignment System
        </h2>

        <div class="text-center mb-4">

            <a href="/add" class="btn btn-success me-3">
                Add Task
            </a>

            <a href="/tasks" class="btn btn-outline-success">
                Task List
            </a>

        </div>

        <p class="text-center text-muted">
            Manage and track tasks efficiently.
            Use the navigation links to add new tasks
            or view and manage existing ones.
        </p>

    </div>

</div>

</body>
</html>
